<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" style="enable-background:new 0 0 70 70;" xml:space="preserve">
<style type="text/css">
	.st0{fill:#FFFFFF;}
</style>
<!-- Slot machine body -->
<rect class="st0" x="10" y="15" width="50" height="40" rx="4" ry="4"/>
<!-- Screen area (cutout) -->
<rect x="15" y="20" width="40" height="20" rx="2" ry="2" fill="#1a1a2e"/>
<!-- Reels -->
<rect class="st0" x="18" y="23" width="10" height="14" rx="1" ry="1" opacity="0.9"/>
<rect class="st0" x="30" y="23" width="10" height="14" rx="1" ry="1" opacity="0.9"/>
<rect class="st0" x="42" y="23" width="10" height="14" rx="1" ry="1" opacity="0.9"/>
<!-- Cherry symbols on reels -->
<circle cx="23" cy="28" r="2.5" fill="#1a1a2e"/>
<circle cx="35" cy="30" r="2.5" fill="#1a1a2e"/>
<circle cx="47" cy="27" r="2.5" fill="#1a1a2e"/>
<!-- Lever -->
<rect class="st0" x="58" y="25" width="3" height="18" rx="1.5" ry="1.5"/>
<circle class="st0" cx="59.5" cy="22" r="4"/>
<!-- Base/feet -->
<rect class="st0" x="12" y="55" width="12" height="4" rx="1" ry="1"/>
<rect class="st0" x="46" y="55" width="12" height="4" rx="1" ry="1"/>
</svg>
