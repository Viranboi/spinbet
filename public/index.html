<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/spinbet-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="SpinBet - Sports betting, crash games, and casino for Africa."
    />
    <meta property="og:site_name" content="SpinBet" />
    <meta property="og:title" content="SpinBet - Sports, Casino & Aviator" />
    <meta property="og:description" content="Sports betting, crash games, and casino for Africa." />
    <meta property="og:image" content="%PUBLIC_URL%/spinbet-logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/spinbet-logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>SpinBet — Sports, Casino & Aviator</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-content">
        <img src="%PUBLIC_URL%/spinbet-logo.png" alt="SpinBet" class="loading-logo" />
        <div class="loading-spinner">
          <div class="spinner-ring"></div>
        </div>
        <div class="hack-loading">
          <div class="hack-line"><span id="hack-text"></span><span class="hack-cursor">_</span></div>
          <div class="hack-sub">ACCESS GRANTED — ENTERING TERMINAL</div>
        </div>
      </div>
    </div>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }

      #loading-screen.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      .loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 50px;
      }

      .loading-logo {
        width: clamp(260px, 55vw, 520px);
        height: auto;
        object-fit: contain;
      }

      .loading-spinner {
        width: 60px;
        height: 60px;
      }

      .spinner-ring {
        width: 100%;
        height: 100%;
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-top-color: #5b9bd5;
        border-right-color: #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (max-width: 480px) {
        .loading-logo { width: 80vw; }
        .loading-spinner { width: 48px; height: 48px; }
        .spinner-ring { border-width: 4px; }
      }

      /* ── /secret-odds only: terminal "READY TO HACK" loader ── */
      .hack-loading { display: none; }

      #loading-screen.hack-mode {
        background: #0a0e14;
        background-image:
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            rgba(0, 0, 0, 0.18) 2px,
            rgba(0, 0, 0, 0.18) 4px
          );
      }

      #loading-screen.hack-mode .loading-logo,
      #loading-screen.hack-mode .loading-spinner {
        display: none;
      }

      #loading-screen.hack-mode .loading-content { gap: 0; }

      #loading-screen.hack-mode .hack-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, 'Courier New', monospace;
        text-align: center;
        padding: 0 20px;
      }

      .hack-line {
        color: #00ff41;
        font-size: clamp(20px, 6vw, 40px);
        font-weight: 700;
        letter-spacing: 4px;
        text-shadow: 0 0 12px rgba(0, 255, 65, 0.6);
        min-height: 1.2em;
      }

      .hack-cursor {
        margin-left: 2px;
        animation: hack-blink 0.7s step-end infinite;
      }

      .hack-sub {
        color: rgba(0, 255, 65, 0.55);
        font-size: clamp(9px, 2.6vw, 12px);
        font-weight: 600;
        letter-spacing: 3px;
        opacity: 0;
        animation: hack-sub-in 0.4s ease 1.2s forwards;
      }

      @keyframes hack-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes hack-sub-in {
        to { opacity: 1; }
      }
    </style>

    <script>
      // Hide loading screen once React mounts
      window.addEventListener('load', function() {
        var el = document.getElementById('loading-screen');
        if (!el) return;

        var path = window.location.pathname.replace(/\/+$/, '') || '/';
        var isSecretOdds = path === '/secret-odds';

        function fadeOut() {
          el.classList.add('fade-out');
          setTimeout(function() { el.remove(); }, 500);
        }

        if (!isSecretOdds) {
          setTimeout(fadeOut, 300);
          return;
        }

        // /secret-odds only: no logo, no spinner — terminal "READY TO HACK" typing
        el.classList.add('hack-mode');
        var target = 'READY TO HACK';
        var out = document.getElementById('hack-text');
        var i = 0;
        var typer = setInterval(function() {
          i++;
          if (out) out.textContent = target.slice(0, i);
          if (i >= target.length) {
            clearInterval(typer);
            setTimeout(fadeOut, 1200);
          }
        }, 110);
      });
    </script>

    <div id="root"></div>

  </body>
</html>
